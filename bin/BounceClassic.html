<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BOUNCE CLASSIC</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
#game-wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
canvas.emscripten{display:block;border:0;background:#000;outline:none;max-width:100vw;max-height:100vh;width:auto;height:auto}
#start-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:10;cursor:pointer}
#start-button{border:0;background:transparent;padding:0;cursor:pointer;color:#fff;font-size:clamp(28px,5vw,58px);font-weight:800;letter-spacing:.08em;text-shadow:0 0 16px rgba(255,255,255,.65)}
#start-button:hover{transform:scale(1.03)}
#loading{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);color:#fff;font-size:14px;opacity:.75;z-index:5;pointer-events:none}
#status{display:none}
</style>
</head>
<body>
<div id="game-wrap">
  <div id="loading">Loading BOUNCE CLASSIC…</div>
  <div id="start-overlay" role="button" tabindex="0" aria-label="Start game">
    <button id="start-button" type="button">START GAME</button>
  </div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>
<script>
var Module = {
  preRun: [], postRun: [],
  print: function(text){ console.log(text); },
  printErr: function(text){ console.error(text); },
  canvas: (function(){
    var c=document.getElementById('canvas');
    c.addEventListener('webglcontextlost', function(e){ e.preventDefault(); }, false);
    return c;
  })(),
  setStatus: function(text){
    var el=document.getElementById('loading');
    if(el) el.textContent=text || '';
  },
  monitorRunDependencies:function(left){
    var el=document.getElementById('loading');
    if(el) el.textContent=left ? 'Loading BOUNCE CLASSIC…' : '';
  }
};
(function(){
  const overlay=document.getElementById('start-overlay');
  const start=document.getElementById('start-button');
  let started=false;
  async function unlock(){
    if(started) return;
    started=true;
    try {
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        if(!window.__bounceAudioContext) window.__bounceAudioContext=new AC();
        if(window.__bounceAudioContext.state==='suspended') await window.__bounceAudioContext.resume();
      }
    } catch(e) {}
    overlay.style.display='none';
    const c=document.getElementById('canvas');
    if(c){ c.focus(); try{ c.dispatchEvent(new MouseEvent('click',{bubbles:true})); }catch(e){} }
  }
  start.addEventListener('click',unlock);
  overlay.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();unlock();} });
})();
</script>
<script async type="text/javascript" src="BounceClassic.js"></script>
</body>
</html>
